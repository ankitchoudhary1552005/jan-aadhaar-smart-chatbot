<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jan Aadhaar Chat History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f4f4;
}

.card{
    margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container mt-4">

<h2 class="text-center mb-4">
📜 Jan Aadhaar Chat History
</h2>

<div class="text-center mb-3">

<input
type="text"
id="searchInput"
class="form-control w-50 mx-auto"
placeholder="🔍 Search Chat..."
onkeyup="searchChat()">

</div>

<div class="text-center mb-4">

<h5>
Total Chats :
<span class="badge bg-primary">
{{ total }}
</span>
</h5>

<a href="/dashboard" class="btn btn-primary">
🏠 Dashboard
</a>

<a href="/chat" class="btn btn-success">
💬 Chat
</a>

<a href="/download_pdf" class="btn btn-danger">
📄 PDF
</a>

<a href="/download_excel" class="btn btn-warning">
📊 Excel
</a>

<a
href="/clear"
class="btn btn-dark"
onclick="return confirm('Delete all chats?')">

🗑 Clear History

</a>

</div>

{% if chats %}

{% for chat in chats %}

<div class="card search-card shadow">

<div class="card-body">

<h5 class="card-title">
👤 {{ chat[1] }}
</h5>

<p>
<b>User :</b><br>
{{ chat[2] }}
</p>

<p>
<b>Bot :</b><br>
{{ chat[3] }}
</p>

<p>

<b>Date & Time :</b>

{{ chat[4] }}

</p>

<a
href="/delete/{{ chat[0] }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this chat?')">

Delete

</a>

</div>

</div>

{% endfor %}

{% else %}

<div class="alert alert-warning text-center">

No Chat History Found

</div>

{% endif %}

</div>

<script>

function searchChat(){

let input=document.getElementById("searchInput").value.toLowerCase();

let cards=document.querySelectorAll(".search-card");

cards.forEach(function(card){

let text=card.innerText.toLowerCase();

if(text.indexOf(input)>-1){

card.style.display="block";

}

else{

card.style.display="none";

}

});

}

</script>

</body>

</html>
