<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand fs-4">
            🤖 Jan Aadhaar Smart Chatbot
        </span>

        <div>

            <a href="/chat" class="btn btn-light">
                💬 Chat
            </a>

            <a href="/logout" class="btn btn-danger">
                🚪 Logout
            </a>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="text-center mb-4">
        Welcome, {{ username }} 👋
    </h2>

    <!-- Cards -->

    <div class="row">

        <div class="col-md-3">

            <div class="card text-bg-primary shadow">

                <div class="card-body text-center">

                    <h5>Total Chats</h5>

                    <h2>{{ total_chats }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-bg-success shadow">

                <div class="card-body text-center">

                    <h5>Total Users</h5>

                    <h2>{{ total_users }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-bg-warning shadow">

                <div class="card-body text-center">

                    <h5>FAQ Replies</h5>

                    <h2>{{ faq_count }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card text-bg-danger shadow">

                <div class="card-body text-center">

                    <h5>AI Replies</h5>

                    <h2>{{ ai_count }}</h2>

                </div>

            </div>

        </div>

    </div>

    <!-- Quick Buttons -->

    <div class="text-center mt-5">

        <a href="/chat" class="btn btn-primary m-2">
            💬 Open Chat
        </a>

        <a href="/history" class="btn btn-success m-2">
            📜 Chat History
        </a>

        <a href="/download_pdf" class="btn btn-danger m-2">
            📄 Download PDF
        </a>

        <a href="/download_excel" class="btn btn-warning m-2">
            📊 Download Excel
        </a>

    </div>

    <!-- Chart -->

    <div class="row mt-5">

        <div class="col-md-6 offset-md-3">

            <div class="card shadow">

                <div class="card-body">

                    <h4 class="text-center">
                        AI vs FAQ Replies
                    </h4>

                    <canvas id="chatChart"></canvas>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const ctx = document.getElementById("chatChart");

new Chart(ctx, {

    type: "pie",

    data: {

        labels: [

            "FAQ Replies",

            "AI Replies"

        ],

        datasets: [{

            data: [

                {{ faq_count }},

                {{ ai_count }}

            ]

        }]

    },

    options: {

        responsive: true

    }

});

</script>

</body>

</html>
