<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jan Aadhaar Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef2f7;
    padding:30px;
}

h1{
    text-align:center;
    color:#2c3e50;
}

.welcome{
    text-align:center;
    margin:15px 0 30px;
    color:#555;
}

.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    width:220px;
    background:white;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    margin-top:10px;
    color:#0d6efd;
    font-size:35px;
}

.buttons{
    text-align:center;
    margin:35px 0;
}

.btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    margin:8px;
    font-weight:bold;
}

.chat{background:#0d6efd;}
.history{background:#198754;}
.pdf{background:#fd7e14;}
.logout{background:#dc3545;}

.chart-box{
    width:90%;
    max-width:700px;
    background:white;
    margin:30px auto;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<h1>📊 Jan Aadhaar Dashboard</h1>

<h2 class="welcome">
Welcome, {{ username }} 👋
</h2>

<div class="container">

<div class="card">
<h3>Total Chats</h3>
<h2>{{ total_chats }}</h2>
</div>

<div class="card">
<h3>Total Users</h3>
<h2>{{ total_users }}</h2>
</div>

<div class="card">
<h3>FAQ Replies</h3>
<h2>{{ faq_count }}</h2>
</div>

<div class="card">
<h3>AI Replies</h3>
<h2>{{ ai_count }}</h2>
</div>

</div>

<div class="buttons">

<a href="/chat" class="btn chat">💬 Open Chat</a>

<a href="/history" class="btn history">📜 History</a>

<a href="/download_pdf" class="btn pdf">📄 PDF</a>

<a href="/download_excel" class="btn" style="background:#28a745;">
    📊 Download Excel
</a>

<a href="/logout">
    <button>🚪 Logout</button>
</a>

</div>

<div class="chart-box">
<h2 style="text-align:center;">Statistics</h2>
<canvas id="barChart"></canvas>
</div>

<div class="chart-box">
<h2 style="text-align:center;">FAQ vs AI</h2>
<canvas id="pieChart"></canvas>
</div>

<script>

new Chart(document.getElementById("barChart"),{

type:"bar",

data:{
labels:["Chats","Users","FAQ","AI"],
datasets:[{
label:"Dashboard Statistics",
data:[
{{ total_chats }},
{{ total_users }},
{{ faq_count }},
{{ ai_count }}
]
}]
},

options:{
responsive:true,
scales:{
y:{
beginAtZero:true
}
}
}

});

new Chart(document.getElementById("pieChart"),{

type:"pie",

data:{
labels:["FAQ Replies","AI Replies"],
datasets:[{
data:[
{{ faq_count }},
{{ ai_count }}
]
}]
},

options:{
responsive:true
}

});

</script>

</body>
</html>
