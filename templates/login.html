<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jan Aadhaar Smart Chatbot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2193b0,#6dd5ed);
}

.login-box{

    width:380px;
    background:rgba(255,255,255,.95);
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.25);

}

.logo{

    font-size:60px;
    margin-bottom:10px;

}

h2{

    color:#1976d2;
    margin-bottom:8px;

}

p{

    color:#666;
    margin-bottom:25px;

}

input{

    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    margin-bottom:20px;
    outline:none;

}

input:focus{

    border-color:#1976d2;

}

button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#1259a8;

}

.footer{

    margin-top:20px;
    color:#777;
    font-size:13px;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">🤖</div>

<h2>Jan Aadhaar Smart Chatbot</h2>

<p>AI Powered Citizen Assistance System</p>

<form action="/login" method="POST">

<input
type="text"
name="username"
placeholder="Enter Your Name"
required>

<button type="submit">
🚀 Start Chat
</button>

</form>

<div class="footer">

B.Tech Mini Project • Python • Flask • Gemini AI

</div>

</div>

</body>
</html>
